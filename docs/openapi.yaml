# Файл выгружен из схем api: cd api && npm run openapi. Руками не править.
openapi: 3.1.0
info:
  title: Диспетчер обращений ЖКХ в MAX — api
  version: "0.16"
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |-
    Выгружено из схем маршрутов (npm run openapi в api/); подробное описание — docs/api.md.

    **public** — доступны снаружи: `/health` на домене api и `/app/*` мини-приложения на его домене как `/api/app/*`, с подписью initData MAX в заголовке `X-Max-Init-Data`.

    **internal** — только из внутренней сети docker compose (бот, команда УК `uk`): запрос через прокси получает 404 `route_not_found` независимо от настроек nginx.
servers:
  - url: https://{appDomain}/api
    description: "мини-приложение: только /app/*"
    variables:
      appDomain:
        default: app.example.ru
  - url: https://{apiDomain}
    description: только /health
    variables:
      apiDomain:
        default: api.example.ru
  - url: http://api:3000
    description: внутренняя сеть docker compose — все маршруты
tags:
  - name: public
    description: доступны снаружи
  - name: internal
    description: только из внутренней сети compose
components:
  securitySchemes:
    maxInitData:
      type: apiKey
      in: header
      name: X-Max-Init-Data
      description: initData из MAX Bridge (window.WebApp.initData); api проверяет подпись токеном бота
paths:
  /admin/houses:
    get:
      operationId: getAdminHouses
      summary: Дома УК; с ?address= — только дом с этим адресом (0 или 1)
      tags:
        - internal
      security: []
      parameters:
        - name: address
          in: query
          required: false
          schema:
            minLength: 1
            maxLength: 200
            type: string
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                properties:
                  houses:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          minimum: 1
                          type: integer
                        address:
                          type: string
                        street:
                          anyOf:
                            - type: string
                            - type: "null"
                        number:
                          anyOf:
                            - type: string
                            - type: "null"
                        chat_link:
                          anyOf:
                            - type: string
                            - type: "null"
                        invite_code:
                          type: string
                        residents:
                          minimum: 0
                          type: integer
                        created_at:
                          format: date-time
                          type: string
                      required:
                        - id
                        - address
                        - street
                        - number
                        - chat_link
                        - invite_code
                        - residents
                        - created_at
                required:
                  - houses
        "400":
          description: Ошибка в запросе
          content:
            application/json:
              schema:
                $id: ErrorResponse
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        description: Машиночитаемый код ошибки
                        type: string
                      message:
                        description: Пояснение для человека
                        type: string
                      details:
                        description: Подробности валидации, если есть
                        type: array
                        items:
                          type: string
                    required:
                      - code
                      - message
                required:
                  - error
    post:
      operationId: postAdminHouses
      summary: Завести дом. Адрес разбирается на улицу и номер — как при вводе жителем
      tags:
        - internal
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              type: object
              properties:
                address:
                  minLength: 1
                  maxLength: 200
                  type: string
                chat_link:
                  pattern: ^https://
                  maxLength: 2048
                  type:
                    - string
                    - "null"
              required:
                - address
      responses:
        "201":
          description: Создано
          content:
            application/json:
              schema:
                type: object
                properties:
                  house:
                    type: object
                    properties:
                      id:
                        minimum: 1
                        type: integer
                      address:
                        type: string
                      street:
                        anyOf:
                          - type: string
                          - type: "null"
                      number:
                        anyOf:
                          - type: string
                          - type: "null"
                      chat_link:
                        anyOf:
                          - type: string
                          - type: "null"
                      invite_code:
                        type: string
                      residents:
                        minimum: 0
                        type: integer
                      created_at:
                        format: date-time
                        type: string
                    required:
                      - id
                      - address
                      - street
                      - number
                      - chat_link
                      - invite_code
                      - residents
                      - created_at
                required:
                  - house
        "400":
          description: Ошибка в запросе
          content:
            application/json:
              schema:
                $id: ErrorResponse
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        description: Машиночитаемый код ошибки
                        type: string
                      message:
                        description: Пояснение для человека
                        type: string
                      details:
                        description: Подробности валидации, если есть
                        type: array
                        items:
                          type: string
                    required:
                      - code
                      - message
                required:
                  - error
        "409":
          description: Конфликт с текущим состоянием
          content:
            application/json:
              schema:
                $id: ErrorResponse
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        description: Машиночитаемый код ошибки
                        type: string
                      message:
                        description: Пояснение для человека
                        type: string
                      details:
                        description: Подробности валидации, если есть
                        type: array
                        items:
                          type: string
                    required:
                      - code
                      - message
                required:
                  - error
