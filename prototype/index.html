<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover обязателен: без него env(safe-area-inset-*) всегда равен нулю -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Заявки ЖКХ — прототип</title>

<style>
/* ============================================================
   ТОКЕНЫ
   ============================================================ */
:root {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --text: #16181d;
  --text-muted: #6b7280;
  --border: #e5e7eb;
  --accent: #2f6fed;
  --accent-press: #2559c9;

  /* Цвета статусов: пара «фон + текст» на каждый */
  --review-bg: #fef3c7;  --review-fg: #92500e;
  --work-bg:   #dbeafe;  --work-fg:   #1d4ed8;
  --done-bg:   #dcfce7;  --done-fg:   #15803d;

  --radius: 14px;
  --radius-sm: 10px;
  --gap: 16px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);

  /* Безопасные зоны телефона. Фолбэк 0px — на десктопе env() пуст. */
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

/* ============================================================
   БАЗА
   ============================================================ */
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  /* Системный шрифт: никаких внешних загрузок, работает оффлайн */
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  /* Прокрутка страницы не «протекает» наружу: внутри шторки мини-приложения
     это иначе цепляет жест закрытия/обновления хост-приложения. */
  overscroll-behavior-y: contain;
}

/* overflow-x: hidden здесь НЕ ставим. Когда одна ось hidden, вторая по
   спецификации перестаёт быть visible и становится auto — body делается
   собственным контейнером прокрутки внутри такого же html, и вертикальная
   прокрутка в мобильных webview ломается. Горизонтального переполнения тут
   нет по устройству вёрстки: всё резиновое, box-sizing: border-box. */

h1, h2, h3, p { margin: 0; }

/* ============================================================
   КАРКАС ЭКРАНА
   Все три экрана лежат в разметке сразу, видим — только с классом
   .screen--active. Так переход не требует перерисовки страницы.
   ============================================================ */
.screen { display: none; }

.screen--active {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh; /* учитывает адресную строку мобильного браузера */
}

.app-header {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  /* Отступ сверху = свой + вырез/статус-бар, иначе заголовок уедет под чёлку */
  padding: 12px var(--gap);
  padding-top: calc(12px + var(--safe-top));
}

.app-header__title {
  flex: 1;
  min-width: 0;
  font-size: 18px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.app-body {
  flex: 1;
  padding: var(--gap);
  display: flex;
  flex-direction: column;
  gap: var(--gap);
}

/* Нижняя панель с главной кнопкой — липкая, с запасом под системную полосу */
.app-footer {
  position: sticky;
  bottom: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 12px var(--gap);
  padding-bottom: calc(12px + var(--safe-bottom));
}

/* ============================================================
   КНОПКИ
   min-height 44px — минимальная комфортная зона нажатия пальцем
   ============================================================ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  min-height: 48px;
  padding: 12px 18px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  transition: background-color .15s ease, opacity .15s ease;
}

.btn--primary { background: var(--accent); color: #fff; }
.btn--primary:active { background: var(--accent-press); }

.btn--ghost {
  background: var(--surface);
  color: var(--accent);
  border-color: var(--border);
}
.btn--ghost:active { background: #f0f3fa; }

/* Круглая кнопка-иконка в шапке (профиль, назад) */
.icon-btn {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  padding: 0;
  background: transparent;
  border: none;
  border-radius: 50%;
  color: var(--text);
  cursor: pointer;
}
.icon-btn:active { background: #eef0f4; }
.icon-btn svg { width: 24px; height: 24px; display: block; }

/* ============================================================
   ФОРМЫ
   ============================================================ */
.form { display: flex; flex-direction: column; gap: 14px; }

.field { display: flex; flex-direction: column; gap: 6px; }

.field__label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
}

.input, .select, .textarea {
  width: 100%;
  padding: 12px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font: inherit;
  /* 16px обязателен: при меньшем размере iOS зумит страницу на фокусе */
  font-size: 16px;
}

.input:focus, .select:focus, .textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(47, 111, 237, .15);
}

.textarea { min-height: 110px; resize: vertical; }

.select {
  appearance: none;
  /* Стрелка нарисована фоном, а не картинкой — файл остаётся автономным */
  background-image: linear-gradient(45deg, transparent 50%, var(--text-muted) 50%),
                    linear-gradient(135deg, var(--text-muted) 50%, transparent 50%);
  background-position: calc(100% - 19px) calc(50% + 2px), calc(100% - 14px) calc(50% + 2px);
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  padding-right: 38px;
}

/* Адрес: узкие поля в два столбца, чтобы форма не растягивалась в простыню */
.field-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

/* ============================================================
   СПИСОК ЗАЯВОК
   ============================================================ */
.section-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: .03em;
}

.ticket-list { display: flex; flex-direction: column; gap: 12px; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.card__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.card__id { font-size: 13px; font-weight: 600; color: var(--text-muted); }
.card__title { font-size: 16px; font-weight: 600; }
.card__address { font-size: 14px; color: var(--text-muted); }

.card__description {
  font-size: 14px;
  color: var(--text-muted);
  /* Длинное описание не должно раздувать карточку — обрезаем двумя строками */
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.badge {
  flex: none;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}

.badge--review { background: var(--review-bg); color: var(--review-fg); }
.badge--work   { background: var(--work-bg);   color: var(--work-fg); }
.badge--done   { background: var(--done-bg);   color: var(--done-fg); }

/* ============================================================
   ЭКРАН ВХОДА
   ============================================================ */
.login {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 24px;
  padding: var(--gap);
  padding-top: calc(var(--gap) + var(--safe-top));
  padding-bottom: calc(var(--gap) + var(--safe-bottom));
}

/* Центрирование по вертикали через auto-поля, а НЕ justify-content: center.
   Если окно ниже содержимого (мини-апп открыт «шторкой»), центрирование во
   flex обрезает верх блока и до него нельзя доскроллить — auto-поля просто
   схлопываются в ноль и всё остаётся доступным. */
.login > :first-child { margin-top: auto; }
.login > :last-child { margin-bottom: auto; }

.login__logo {
  width: 64px;
  height: 64px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--accent);
  border-radius: 18px;
  color: #fff;
}
.login__logo svg { width: 34px; height: 34px; }

.login__title { font-size: 24px; font-weight: 700; text-align: center; }

.login__subtitle {
  font-size: 15px;
  color: var(--text-muted);
  text-align: center;
  margin-top: 6px;
}

.login__card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* ============================================================
   УЗКИЕ ЭКРАНЫ
   ============================================================ */
@media (max-width: 360px) {
  :root { --gap: 12px; }
  .field-row { grid-template-columns: 1fr; }
  .app-header__title { font-size: 17px; }
}

/* ============================================================
   НИЗКОЕ ОКНО
   Мини-приложение в MAX открывается «шторкой» на часть экрана и только
   потом разворачивается. Здесь ужимаем крупные элементы входа, чтобы
   форма помещалась без прокрутки ещё до разворота.
   ============================================================ */
@media (max-height: 620px) {
  .login { gap: 16px; }
  .login__logo { width: 48px; height: 48px; border-radius: 14px; }
  .login__logo svg { width: 26px; height: 26px; }
  .login__title { font-size: 20px; }
  .login__subtitle { font-size: 14px; }
  .login__card { padding: 14px; }
}
</style>
</head>

<body>

<!-- ============================================================
     ЭКРАН 1 — ВХОД (заглушка авторизации)
     ============================================================ -->
<section class="screen screen--active" id="screen-login">
  <div class="login">
    <div>
      <div class="login__logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 10.5 12 3l9 7.5"></path>
          <path d="M5 9.5V21h14V9.5"></path>
          <path d="M9.5 21v-6h5v6"></path>
        </svg>
      </div>
      <h1 class="login__title" style="margin-top:16px">Заявки ЖКХ</h1>
      <p class="login__subtitle">Аварии и обращения по вашему дому</p>
    </div>

    <form class="login__card" id="login-form" novalidate>
      <div class="field">
        <label class="field__label" for="reg-number">Регистрационный номер</label>
        <input class="input" id="reg-number" name="regNumber" type="text"
               inputmode="numeric" placeholder="Введите номер, напр. 12345" autocomplete="off">
      </div>
      <button class="btn btn--primary" type="submit">Войти</button>
    </form>
  </div>
</section>

<!-- ============================================================
     ЭКРАН 2 — ГЛАВНАЯ (список заявок)
     ============================================================ -->
<section class="screen" id="screen-home">
  <header class="app-header">
    <h1 class="app-header__title">Мои заявки</h1>
    <button class="icon-btn" type="button" id="profile-btn" aria-label="Профиль">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="8" r="4"></circle>
        <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"></path>
      </svg>
    </button>
  </header>

  <div class="app-body">
    <button class="btn btn--ghost" type="button" id="go-new-btn">+ Создать новую заявку</button>

    <div>
      <h2 class="section-title">Мои заявки</h2>
      <!-- Карточки рисует renderTickets() -->
      <div class="ticket-list" id="ticket-list" style="margin-top:12px"></div>
    </div>
  </div>
</section>

<!-- ============================================================
     ЭКРАН 3 — СОЗДАНИЕ ЗАЯВКИ
     ============================================================ -->
<section class="screen" id="screen-new">
  <header class="app-header">
    <button class="icon-btn" type="button" id="back-btn" aria-label="Назад">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 19l-7-7 7-7"></path>
      </svg>
    </button>
    <h1 class="app-header__title">Новая заявка</h1>
  </header>

  <!-- Без novalidate: обязательные поля проверяет сам браузер, без единой строки JS.
       Иначе пустая отправка добавила бы карточку без адреса. -->
  <form class="app-body" id="new-ticket-form">
    <div class="form">
      <div class="field">
        <label class="field__label" for="type">Тип проблемы</label>
        <select class="select" id="type" name="type">
          <option value="Прорыв трубы">Прорыв трубы</option>
          <option value="Электричество">Электричество</option>
          <option value="Отопление">Отопление</option>
          <option value="Интернет">Интернет</option>
          <option value="Другое">Другое</option>
        </select>
      </div>

      <div class="field">
        <label class="field__label" for="street">Улица</label>
        <input class="input" id="street" name="street" type="text" placeholder="напр. Ленина" required>
      </div>

      <div class="field-row">
        <div class="field">
          <label class="field__label" for="house">Дом</label>
          <input class="input" id="house" name="house" type="text" placeholder="напр. 10" required>
        </div>
        <div class="field">
          <label class="field__label" for="block">Корпус</label>
          <input class="input" id="block" name="block" type="text" placeholder="напр. 2">
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label class="field__label" for="entrance">Подъезд</label>
          <input class="input" id="entrance" name="entrance" type="text" placeholder="напр. 3">
        </div>
        <div class="field">
          <label class="field__label" for="flat">Квартира</label>
          <input class="input" id="flat" name="flat" type="text" placeholder="напр. 15" required>
        </div>
      </div>

      <div class="field">
        <label class="field__label" for="description">Описание проблемы</label>
        <textarea class="textarea" id="description" name="description"
                  placeholder="Опишите, что случилось: где течёт, с какого времени, есть ли угроза" required></textarea>
      </div>
    </div>

    <footer class="app-footer" style="margin:0 calc(-1 * var(--gap)) calc(-1 * var(--gap))">
      <button class="btn btn--primary" type="submit">Отправить заявку</button>
    </footer>
  </form>
</section>

<script>
'use strict';

/* ============================================================
   1. ДАННЫЕ (моки)
   Живут в памяти вкладки: перезагрузка страницы возвращает их
   в исходное состояние. Это осознанно — прототип показывает
   переходы между экранами, а не хранение.
   ============================================================ */

/** Статусы заявки: ключ -> подпись и css-модификатор бейджа. */
var STATUSES = {
  review: { label: 'В рассмотрении', modifier: 'badge--review' },
  work:   { label: 'В работе',       modifier: 'badge--work' },
  done:   { label: 'Решено',         modifier: 'badge--done' }
};

/** Стартовые заявки. Новые добавляются в начало массива. */
var ticketsStore = [
  {
    id: 101, type: 'Прорыв трубы', status: 'review',
    street: 'Ленина', house: '10', block: '', entrance: '', flat: '15',
    description: 'В подвале под подъездом течёт вода, слышен шум в стояке.'
  },
  {
    id: 100, type: 'Проблема с электричеством', status: 'work',
    street: 'Ленина', house: '10', block: '', entrance: '', flat: '15',
    description: 'Мигает свет на кухне, периодически выбивает автомат.'
  },
  {
    id: 99, type: 'Нет интернета', status: 'done',
    street: 'Ленина', house: '10', block: '', entrance: '', flat: '15',
    description: 'Пропал интернет во всём подъезде после грозы.'
  }
];

/** Счётчик номеров. Реальный id будет приходить от бэкенда. */
var nextTicketId = 102;

/* ============================================================
   2. СЛОЙ API — ЗАГЛУШКИ
   ВСЯ будущая работа с сервером живёт здесь и только здесь.
   Функции async специально: когда появится настоящий fetch,
   менять придётся только тела этих трёх функций, а весь
   вызывающий код ниже останется без единой правки.
   ============================================================ */

/**
 * Вход по регистрационному номеру.
 * Сейчас пускает всегда и никого не проверяет.
 */
async function login(regNumber) {
  // TODO: заменить на реальный fetch к бэкенду
  // return fetch('/api/login', {
  //   method: 'POST',
  //   headers: { 'Content-Type': 'application/json' },
  //   body: JSON.stringify({ regNumber: regNumber })
  // }).then(function (r) { return r.json(); });
  return { ok: true, regNumber: regNumber };
}

/**
 * Список заявок текущего жителя.
 * Сейчас отдаёт локальный массив.
 */
async function fetchTickets() {
  // TODO: заменить на реальный fetch к бэкенду
  // return fetch('/api/tickets').then(function (r) { return r.json(); });
  return ticketsStore;
}

/**
 * Создание заявки.
 * Сейчас присваивает номер локально и кладёт в начало массива.
 * @param {{type:string, street:string, house:string, block:string,
 *          entrance:string, flat:string, description:string}} data
 */
async function createTicket(data) {
  // TODO: заменить на реальный fetch к бэкенду
  // return fetch('/api/tickets', {
  //   method: 'POST',
  //   headers: { 'Content-Type': 'application/json' },
  //   body: JSON.stringify(data)
  // }).then(function (r) { return r.json(); });

  var ticket = {
    id: nextTicketId,
    type: data.type,
    status: 'review', // новая заявка всегда приходит в рассмотрение
    street: data.street,
    house: data.house,
    block: data.block,
    entrance: data.entrance,
    flat: data.flat,
    description: data.description
  };

  nextTicketId += 1;
  ticketsStore.unshift(ticket);
  return ticket;
}

/* ============================================================
   3. НАВИГАЦИЯ
   ============================================================ */

/** Показывает один экран, прячет остальные. */
function showScreen(screenId) {
  var screens = document.querySelectorAll('.screen');

  for (var i = 0; i < screens.length; i++) {
    screens[i].classList.toggle('screen--active', screens[i].id === screenId);
  }

  // Иначе новый экран открывается прокрученным туда же, где был предыдущий
  window.scrollTo(0, 0);
}

/* ============================================================
   4. РЕНДЕР СПИСКА
   ============================================================ */

/** Собирает адрес из заполненных частей: пустые поля пропускаются. */
function formatAddress(ticket) {
  var parts = [];

  if (ticket.street) { parts.push('ул. ' + ticket.street); }
  if (ticket.house) { parts.push('д. ' + ticket.house); }
  if (ticket.block) { parts.push('корп. ' + ticket.block); }
  if (ticket.entrance) { parts.push('подъезд ' + ticket.entrance); }
  if (ticket.flat) { parts.push('кв. ' + ticket.flat); }

  return parts.join(', ');
}

/**
 * Карточка одной заявки.
 * Текст вставляется через textContent, а не innerHTML: описание и адрес
 * пишет пользователь, и шаблонная строка с innerHTML дала бы XSS.
 */
function createTicketCard(ticket) {
  var status = STATUSES[ticket.status] || STATUSES.review;

  var card = document.createElement('article');
  card.className = 'card';

  var head = document.createElement('div');
  head.className = 'card__head';

  var number = document.createElement('span');
  number.className = 'card__id';
  number.textContent = '#' + ticket.id;

  var badge = document.createElement('span');
  badge.className = 'badge ' + status.modifier;
  badge.textContent = status.label;

  head.appendChild(number);
  head.appendChild(badge);

  var title = document.createElement('h3');
  title.className = 'card__title';
  title.textContent = ticket.type;

  var address = document.createElement('p');
  address.className = 'card__address';
  address.textContent = formatAddress(ticket);

  card.appendChild(head);
  card.appendChild(title);
  card.appendChild(address);

  if (ticket.description) {
    var description = document.createElement('p');
    description.className = 'card__description';
    description.textContent = ticket.description;
    card.appendChild(description);
  }

  return card;
}

/** Перерисовывает весь список заявок. */
async function renderTickets() {
  var tickets = await fetchTickets();
  var list = document.getElementById('ticket-list');

  list.textContent = '';

  for (var i = 0; i < tickets.length; i++) {
    list.appendChild(createTicketCard(tickets[i]));
  }
}

/* ============================================================
   5. ОБРАБОТЧИКИ
   ============================================================ */

/** Вход: без проверки номера — это заглушка авторизации. */
document.getElementById('login-form').addEventListener('submit', async function (event) {
  event.preventDefault();

  var regNumber = document.getElementById('reg-number').value.trim();

  await login(regNumber);
  await renderTickets();
  showScreen('screen-home');
});

document.getElementById('go-new-btn').addEventListener('click', function () {
  showScreen('screen-new');
});

document.getElementById('back-btn').addEventListener('click', function () {
  showScreen('screen-home');
});

/** Отправка заявки: создаём, перерисовываем список, возвращаемся на главную. */
document.getElementById('new-ticket-form').addEventListener('submit', async function (event) {
  event.preventDefault();

  var form = event.currentTarget;
  // Через form.elements, а не form.type: у формы есть собственные свойства,
  // и обращение по имени поля может неожиданно попасть в одно из них.
  var fields = form.elements;

  await createTicket({
    type: fields.type.value,
    street: fields.street.value.trim(),
    house: fields.house.value.trim(),
    block: fields.block.value.trim(),
    entrance: fields.entrance.value.trim(),
    flat: fields.flat.value.trim(),
    description: fields.description.value.trim()
  });

  await renderTickets();
  form.reset();
  showScreen('screen-home');
});

/* ============================================================
   6. СТАРТ
   Список рисуем сразу: после входа экран должен быть готов.
   ============================================================ */
renderTickets();
</script>
