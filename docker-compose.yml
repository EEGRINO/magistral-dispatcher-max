# Запуск всего проекта одной командой:
#
#   cp .env.example .env   # подставить настоящий MAX_BOT_TOKEN
#   docker compose up --build
#
# Ключ "version:" намеренно отсутствует — в Compose v2 он устарел и вызывает warning.

name: max-dispatcher

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-max}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан — заполни .env}
      POSTGRES_DB: ${POSTGRES_DB:-max_dispatcher}
      # Без этого postgres:16-alpine ругается на locale при initdb.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      # Именованный том: данные переживают `docker compose down`.
      # Снести вместе с данными — `docker compose down -v`.
      - pgdata:/var/lib/postgresql/data
    ports:
      # Наружу — чтобы можно было подключиться psql/DBeaver с хоста.
      # Внутри сети compose порт всегда 5432, независимо от DB_PORT.
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      # pg_isready, а не проверка порта: порт открывается раньше, чем БД
      # реально готова принимать запросы, и api стартовал бы в пустоту.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-max} -d ${POSTGRES_DB:-max_dispatcher}"]
      interval: 5s
      timeout: 5s
      retries: 10
      # Первый запуск дольше: initdb создаёт кластер.
      start_period: 15s
    networks:
      - backend

  # ── Миграции ────────────────────────────────────────────────────────────
  # Одноразовый контейнер: применяет миграции и завершается с кодом 0.
  #
  # Отдельным сервисом, а не шагом внутри api, по трём причинам:
  #   1. в выводе `docker compose up` видно отдельным шагом, что схема применена;
  #   2. если api когда-нибудь поднимут в нескольких репликах, они не начнут
  #      мигрировать схему наперегонки;
  #   3. перезапустить миграции можно, не трогая api:
  #      docker compose run --rm migrate
  migrate:
    build:
      context: ./db
    # Одноразовая задача: перезапускать её при выходе не нужно.
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL не задан — заполни .env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  # ── API ─────────────────────────────────────────────────────────────────
  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${API_PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL не задан — заполни .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${API_PORT:-3000}:${API_PORT:-3000}"
    depends_on:
      db:
        # Ждём именно healthy, а не просто "контейнер запущен".
        condition: service_healthy
      migrate:
        # Стартуем только после успешного применения миграций: иначе первый
        # же запрос упадёт на отсутствующей таблице.
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

  # ── Мини-приложение жителя ─────────────────────────────────────────────
  # Статика (Vite-сборка + nginx), собранная из miniapp/. Пока работает на
  # моках — живого api ещё не спрашивает (miniapp/src/api.ts, TODO на
  # GET/POST /api/tickets). depends_on на api нет: страница отдаётся
  # статикой независимо от того, жив бэкенд или нет.
  miniapp:
    build:
      context: ./miniapp
    restart: unless-stopped
    # ports нет: наружу отдаёт proxy (Caddy, см. scripts/setup-domain.sh).
    # Без него сервис виден только внутри сети compose, по имени miniapp:80.
    networks:
      - backend

  # ── Бот ─────────────────────────────────────────────────────────────────
  bot:
    build:
      context: ./bot
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # `:?` — compose упадёт с внятным сообщением, если .env не заполнен,
      # вместо того чтобы поднять бота с пустым токеном и словить 401.
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:?MAX_BOT_TOKEN не задан — скопируй .env.example в .env}
      MAX_API_BASE_URL: ${MAX_API_BASE_URL:-https://platform-api2.max.ru}
      MAX_POLL_TIMEOUT: ${MAX_POLL_TIMEOUT:-90}
      # Без этого fetch внутри Alpine падает: platform-api2.max.ru подписан
      # Russian Trusted CA (Минцифры РФ), которого нет ни в списке Node.js,
      # ни в системе чистого Alpine-образа. Сертификат вшит в образ — см.
      # bot/certs/README.md и bot/Dockerfile.
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-certs/russian-trusted-ca-chain.pem}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Адрес api внутри сети compose: имя сервиса резолвится как хост.
      API_BASE_URL: http://api:${API_PORT:-3000}
      API_TIMEOUT_MS: ${API_TIMEOUT_MS:-5000}

    depends_on:
      api:
        condition: service_healthy

    # Вчера depends_on здесь сознательно не было: бот ни от чего не зависел,
    # и привязка к чужому health означала бы «бот молчит из-за упавшей БД».
    # Сегодня зависимость настоящая — на /start бот идёт в api за жителем,
    # поэтому порядок запуска нужен.
    #
    # Риск «бот молчит» при этом никуда не делся, и снят он не здесь, а в коде:
    # если api не ответил, бот здоровается без ID (bot/src/bot.ts, buildGreeting).
    # depends_on управляет порядком СТАРТА, он не защищает от падения api
    # через час после запуска — это разные задачи, и вторую compose не решает.

    # ports нет: long polling — это исходящие соединения.
    # Публичный HTTPS-эндпоинт нужен только для webhook.
    networks:
      - backend

volumes:
  pgdata:

networks:
  backend:
    driver: bridge
