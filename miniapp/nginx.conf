server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Имена файлов в assets/ содержат хэш содержимого: меняется файл —
    # меняется имя, поэтому старый можно кешировать навсегда.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        # index.html кешировать нельзя: иначе после деплоя клиент
        # продолжит тянуть ссылки на старый бандл.
        add_header Cache-Control "no-cache";
    }
}
